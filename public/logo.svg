<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 88" fill="none" font-family="Inter, system-ui, sans-serif">
  <!-- Stethoscope + thermometer "H" mark -->
  <g transform="translate(8,6)">
    <!-- Vertical bar of H (orange thermometer) -->
    <rect x="6" y="6" width="9" height="58" rx="4.5" fill="#FF6B35"/>
    <circle cx="10.5" cy="68" r="9" fill="#FF6B35"/>
    <!-- Right vertical of H (teal) -->
    <rect x="34" y="6" width="9" height="58" rx="4.5" fill="#0F4C5C"/>
    <!-- Crossbar with ECG dip -->
    <path d="M 15 36 L 22 36 L 25 30 L 28 42 L 31 32 L 34 36"
          stroke="#0F4C5C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: Hanu + ONE -->
  <g transform="translate(70,0)">
    <text x="0" y="58" font-size="44" font-weight="800" fill="#0F4C5C" letter-spacing="-0.02em">Hanu</text>
    <text x="116" y="58" font-size="44" font-weight="800" fill="#FF6B35" letter-spacing="-0.02em">ONE</text>
  </g>

  <!-- Tagline underline + tagline text -->
  <g transform="translate(70,68)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="#0F4C5C" stroke-width="1.5"/>
    <text x="90" y="13" font-size="10" font-weight="600" fill="#0F4C5C" text-anchor="middle" letter-spacing="0.08em">TRUSTED HEALTHCARE, AT HOME</text>
  </g>
</svg>
